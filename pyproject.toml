[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "re2020-assistant"
version = "0.8.2"
description = "Assistant d'étude RE2020 (énergie + ACV) pour préparer la saisie Pléiades — DEEP-WATT"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "ezdxf>=1.3",
    "shapely>=2.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "rapidocr_onnxruntime>=1.3",  # OCR local des textes dessinés en traits (cartouches, polices SHX)
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "python-multipart"]
rapport = ["weasyprint", "xhtml2pdf>=0.2.16"]
dev = ["pytest", "pyflakes", "pypdf", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
